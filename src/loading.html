<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DSH 客户端</title>
<style>
  html, body { height: 100%; margin: 0; background: #0d1117; color: #e6edf3;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; }
  .spinner { width: 40px; height: 40px; margin: 0 auto 20px; border: 4px solid #30363d;
    border-top-color: #58a6ff; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #8b949e; font-size: 14px; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div>正在启动 DSH 服务…</div>
    <p>首次启动可能需要 10~60 秒</p>
  </div>
</body>
</html>
